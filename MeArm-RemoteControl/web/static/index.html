<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="R9EZap1rBZaAgyPB6FWlDL">
<head data-page-node-id="rgwNpaG8GfHVO8K8mWyHD3">
  <meta charset="UTF-8" data-page-node-id="ssJplPxfGb2I5XQ8dhILSe" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="vR7CTs5xz76ZzF35zZXP4T" />
  <title>arm-web · 机械臂控制</title>
  <link rel="stylesheet" href="/css/style.css" data-page-node-id="oWwKUhrM1gTzfHjE8ClciX" />
  <!-- Three.js (UMD, 全局 THREE)。优先 cdnjs，失败回退 unpkg -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    if (!window.THREE) {
      document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
    }
  </script>
</head>
<body data-page-node-id="IbfPwaXjjVNzcHxIZ1lMBe">
  <header class="topbar" data-page-node-id="ituxvdafCQbcPmgdK8tRdf">
    <div class="brand" data-page-node-id="rtBV3SX3uiBBjTFuMNbDEV">arm-web <span class="sub" data-page-node-id="UbdVTZT3lQ19J7a6yQnPvc">机械臂串口控制</span></div>
    <div class="status" data-page-node-id="8FnBK1Yoem7OJXtJ43WDxs">
      <span id="conn-dot" class="dot off" data-page-node-id="Ts6EwuB0sLO4ApSjpsdINZ"></span>
      <span id="conn-text" data-page-node-id="397s7XoSuQiXjG2xk9EsKy">连接中…</span>
      <span class="sep" data-page-node-id="ByIgGkbF6v9tmAilyVRJ9g">|</span>
      <span id="serial-dot" class="dot off" data-page-node-id="zKqAserial"></span>
      <span id="serial-text" data-page-node-id="dHPozyTsor6QVvGsluGHF7">串口: --</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-mode="joystick">遥控模式</button>
  </nav>

  <!-- 双摇杆遥控 -->
  <section id="panel-joystick" class="panel active">
    <div class="stage">
      <div class="joy-grid">
        <div class="joy-cell">
          <div class="joy-label">左摇杆 · 底座 / 左舵</div>
          <div id="joystick-left" class="viewport joy-view"></div>
          <div class="readout">
            <div>X(底座): <span class="jx">0.00</span></div>
            <div>Y(左舵): <span class="jy">0.00</span></div>
          </div>
        </div>
        <div class="joy-cell">
          <div class="joy-label">右摇杆 · 夹取 / 右舵</div>
          <div id="joystick-right" class="viewport joy-view"></div>
          <div class="readout">
            <div>X(夹取): <span class="jx">0.00</span></div>
            <div>Y(右舵): <span class="jy">0.00</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="side">
      <h3>舵机角度</h3>
      <div class="angles" id="angles">
        <div>S6(夹取): <span id="a6">--</span></div>
        <div>S7(右): <span id="a7">--</span></div>
        <div>S8(左): <span id="a8">--</span></div>
        <div>S9(底座): <span id="a9">--</span></div>
      </div>
      <h3>快捷指令 <span class="hint" id="cmd-hint"></span></h3>
      <div class="btns" id="arm-btns">
        <button data-cmd="RESET">复位 RESET</button>
        <button data-cmd="STATUS">状态 STATUS</button>
        <button data-cmd="JOYHW OFF">摇杆硬件关</button>
        <button data-cmd="JOYHW ON">摇杆硬件开</button>
      </div>

      <!-- 网络链路（MeArm-3D TCP）专属面板：**纯新增区块**，不改造上面任何元素。
           显示哪几项由链路的 caps 决定（串口模式下整块隐藏），
           所以同一份页面在两种模式下都成立。 -->
      <div id="net-panel" hidden>
        <h3>网络控制 <span class="hint" id="net-device"></span></h3>
        <div class="net-row">
          <label for="xyz-step">XYZ 步长 (mm)</label>
          <input id="xyz-step" type="number" value="5" min="0.5" max="50" step="0.5" />
        </div>
        <div class="btns" id="xyz-btns">
          <button data-xyz="x+" title="沿 X 正向（前）">X +</button>
          <button data-xyz="x-" title="沿 X 负向（后）">X −</button>
          <button data-xyz="y+" title="沿 Y 正向（左）">Y +</button>
          <button data-xyz="y-" title="沿 Y 负向（右）">Y −</button>
          <button data-xyz="z+" title="沿 Z 正向（上）">Z +</button>
          <button data-xyz="z-" title="沿 Z 负向（下）">Z −</button>
        </div>
        <div class="btns" id="grip-btns">
          <button data-grip="open">爪 张开</button>
          <button data-grip="close">爪 闭合</button>
        </div>
        <h3>舵机直控 <span class="hint">绝对角</span></h3>
        <div class="servo-rows" id="servo-rows"></div>
        <div class="readout net-readout">
          <div>末端 TCP: <span id="net-tcp">--</span></div>
        </div>
        <div class="btns">
          <button id="net-refresh">刷新状态</button>
        </div>
      </div>

      <div class="term">
        <div class="term-title">链路日志</div>
        <pre id="term"></pre>
      </div>
    </div>
  </section>

  <script src="/js/wsclient.js"></script>
  <script src="/js/joystick3d.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/netpanel.js"></script>
</body>
</html>
