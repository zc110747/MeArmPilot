# ============================================================
# arm-web — Go 串口转 Web / TCP 服务器配置
# 所有串口、IP、端口均可在此修改；修改后重启程序生效。
# ============================================================

# ---- 运行模式 ----
#   serial  = 原有真机链路：打开串口，走 arm-device 协议（默认，行为不变）
#   network = 网络链路：**不打开串口**，用 TCP Client 连 MeArm-3D 的 TCP 控制接口
#
# ⚠️ 这里的 network 与 MeArm-3D 的 `--real`（TCP Real 模式）是两回事：
#    前者是本服务"不走串口"，后者是对方"驱动真机"。
#
# `start.bat` 会用命令行 `-mode` 覆盖本值：不带参数 → network；带 --real → serial。
# 直接运行 `arm-web.exe -c config.yaml` 时用本值（默认 serial）。
mode: "serial"

# ---- 串口（对接 arm-device 固件，默认 COM4 / 115200 8N1）----
serial:
  port: "COM16"        # Windows: COMx ; Linux/macOS: /dev/ttyUSB0 等
  baud: 115200        # 波特率（arm-device 固件 USART0 默认 115200）
  databits: 8
  stopbits: 1
  parity: "N"         # N(无) / E(偶) / O(奇)
  # 串口未连接时自动重连间隔（秒）
  reconnect_sec: 3
  # 两条指令下发的最小间隔（毫秒）。命令-应答(ACK)门控 + 摇杆最新值合并已能防止
  # 高频冲刷设备，故默认 0（不额外节流）；如需兜底再按需调大。
  min_interval_ms: 0
  # 命令-应答（ACK）超时（毫秒）：每条指令发出后等待下位机应答行，超时即判定
  # 通讯失败（界面显示“通讯失败”），且不再自动重发，等待用户下一条新指令。
  # 注意：arm-device 每条合法指令都会回一行（OK ... / ERR ...），即作为应答。
  ack_timeout_ms: 800

# ---- Web 本机控制（Three.js 3D 摇杆）----
web:
  enabled: true
  host: "0.0.0.0"     # 绑定 IP；0.0.0.0 = 本机所有网卡（含局域网）
  port: 9001          # 浏览器访问 http://<本机IP>:9001
  ws_path: "/ws"      # WebSocket 路径

# ---- TCP 局域网转发（为其它设备/远程控制预留接口）----
# ⚠️ 本段**仅串口模式生效**：它转发的是 arm-device 文本指令（JOY/ANGLE/...），
#    network 模式下没有串口可转发，该服务端不会被启动（端口 9002 不会监听）。
tcp:
  enabled: true
  host: "0.0.0.0"     # 绑定 IP；0.0.0.0 = 局域网可访问
  port: 9002          # 其它设备 telnet/raw 连接此端口即可下发 arm-device 指令

# 日志级别: debug / info / warn / error
log_level: "info"

# ---- 网络链路：作为 TCP Client 连接 MeArm-3D 的 TCP 控制接口 ----
# 仅当 mode: "network" 时生效。协议见 MeArm-3D/docs/tcp-control-v1.md：
#   JSON Lines（一行一条 JSON + \n），严格一问一答，连接保持复用。
#
# 传输边界（刻意不做的事）：本服务**不**做 IK/FK、不做坐标变换、不算舵机角、
#   不做软限位、不碰 MeArm-3D 的 Sim/Real 选择 —— 那些都是 MeArm-3D 的职责。
#   本服务只把「人的输入」翻译成 MeArm-3D 已有的命令：servo / move / gripper / state。
network:
  host: "127.0.0.1"   # MeArm-3D TCP Server 地址（同机默认回环；跨机填对方 IP）
  port: 9100          # MeArm-3D TCP 端口（见其 config.yaml 的 tcp.port）

  # 舵机接线表：本服务的「摇杆轴 / 状态显示」与 MeArm-3D 的「TCP 编号 1..N」之间的
  # 唯一一份对照。**顺序即 MeArm-3D 侧 servo 数组的下标顺序**（1-based）。
  #   MeArm-3D Model.JointOrder() = 1:base 2:shoulder 3:elbow 4:gripper
  #   arm-device 固件舵机 id    = 9:底座 7:右舵(肩) 8:左舵(肘) 6:夹取
  # 故映射为 [9, 7, 8, 6]：下标 0 ↔ TCP#1 ↔ 固件 9(底座) … 依此类推。
  # ⚠️ 改这里等于同时改「摇杆往哪个舵机发」和「界面显示哪个舵机的角」，只有一份。
  servo_ids: [9, 7, 8, 6]

  # 摇杆死区（视觉倾角，度）：偏移 <= 该值视为居中。沿用 joystick.deadband_deg 的
  # 语义与默认值，两者可独立调；出死区即产生可见速度（见 min_speed_deg_per_s）。
  deadband_deg: 5

  # 摇杆满偏(31.5°)对应的角速度（度/秒）。**时间驱动**：增量 = 速度 × 实际经过的 dt，
  # 因此前端发送频率高低不影响速度，只影响下发频率。
  #   min 保证「刚出死区就有肉眼可见的动作」；max 是满偏上限（真机 240°/s 不会丢步）。
  min_speed_deg_per_s: 12
  max_speed_deg_per_s: 90

  # 摇杆积分节流（毫秒）：距上次下发不足 tick_ms 的帧会被合并（latest-wins），
  # max_tick_ms 是兜底上限 —— 即使前端卡住很久，单次积分也不会跳变过大。
  tick_ms: 25
  max_tick_ms: 200

  # 连接与请求超时（毫秒）
  connect_timeout_ms: 3000
  request_timeout_ms: 1000

  # 断线重连退避（毫秒）：从 min 指数递增到 max 封顶，避免无限快速重连打爆对端。
  reconnect_min_ms: 500
  reconnect_max_ms: 5000

  # 离散命令（servo/move/gripper/state）队列长度：满则丢最旧（摇杆走独立通道，
  # 永远只保留最新值，不占本队列）。
  queue_size: 64

  # 连接成功后是否自动发 `state` 建立「当前舵机角」基准。
  # 关掉则首次摇杆动作前无基准 → 退化为 fallback_angle 起步。
  auto_sync: true

  # 拿不到基准（对端不支持 state / auto_sync=false）时的起步角（度）。
  # 90 = 中位：robot.yaml homePose 经标定换算即四轴 90°，sim 初始位亦为 HOME，
  # arm-device 固件 RESET 后同样是全 90°。取不到真实值时就停在这里，并显式上报。
  fallback_angle: 90

  # 下发角度的硬边界（度）—— 仅作为「明显越界」的本地前置拒绝，**不是软限位**。
  # 真正的关节限位由 MeArm-3D 依 robot.yaml 判定并返回 error，本服务只负责回滚。
  angle_min: 0
  angle_max: 180

# ---- 网页双摇杆（遥控形式）-> 舵机映射（同样可在 YAML 配置）----
# 左摇杆 X=底座(9) Y=左舵(8)；右摇杆 X=夹取(6) Y=右舵(7)。
# 方向语义：推杆方向 = 舵机角度增大（+）。固件 9/6/7 轴是 raw>800->负步长
# （8 轴出厂即反相），故默认对 9/6/7 三轴 invert=true、8 轴 false。
# 若个别轴与实际机构方向仍相反，把对应 invert 改回 false 即可，无需改代码。
joystick:
  lx_servo: 9
  ly_servo: 8
  rx_servo: 6
  ry_servo: 7
  invert_lx: true
  invert_ly: false
  invert_rx: true
  invert_ry: true
  # 摇杆动作死区（视觉倾角，度）：偏移 <= 该值的轴视为居中、不下发；
  # 四轴全部在死区内时整帧 JOY 都不下发（串口零流量）。
  # 网页摇杆满偏约 31.5°，默认 5°（约 16% 行程），超过后立即进入有效步进区间。
  deadband_deg: 5
