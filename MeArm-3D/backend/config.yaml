# =============================================================================
# ArmPilot 后端（关节级 WebSocket 服务）运行配置
# -----------------------------------------------------------------------------
# ⚠️ 本文件**只放运行参数**。关节限位、标定（offset/scale/reverse）、HOME 位
#    一律来自 ../robot-package/mearm-v1/model/robot.yaml —— 那是前后端共用的唯一真值。
#    在这里再抄一份限位，必然漂移（实测已证明按固件命名推定角色会得到反向机构）。
# =============================================================================

web:
  host: "0.0.0.0"          # 0.0.0.0 = 本机所有网卡（含局域网）
  port: 8090               # 刻意避开 MeArm-RemoteControl 的 8080，两者可同时运行
  path: "/ws/joint"
  ping_interval_ms: 15000  # 传输层 ping 间隔（浏览器会自动回 pong）
  client_timeout_ms: 40000 # 静默超过此值判链路已死并断开

robot:
  # 模型**选择器**（config/robots.yaml）—— 它只回答"该加载哪台机器人"，
  # 路径不存在时按 ../config/robots.yaml → config/robots.yaml → ../MeArm-3D/config/robots.yaml 回退。
  selector_path: "../config/robots.yaml"
  # 要加载哪台机器人（选择器的 key）。**留空 = 选择器的 default** ⇒ 行为与单机器人时代一致。
  # 可用命令行 `-robot mearm-v1` 覆盖（优先级：命令行 > 这里 > 选择器的 default）。
  model_id: ""
  # ⚠️ config_path 已废弃（单机器人时代直接指向 robot.yaml 的写法）。
  #    现在"加载哪一份 robot.yaml"由选择器决定 —— 它是**三端共用**的那一份声明。

device:
  # sim    = 内置假固件（无真机也能跑通字节级闭环）
  # mujoco = MuJoCo 物理仿真（device.Device 的第三个实现，协议与固件逐字节一致）
  # serial = 真串口
  #
  # 三者的**上层完全一致**：controller 独占限位/标定与 ACK 门控，
  # WebSocket 与前端一行都不用改。
  #
  # ★ 三条链路各有一份 **mode 不同** 的配置，跑的是同一套代码：
  #     config.yaml         → sim    （本文件，默认；不碰硬件、无额外依赖）
  #     config.mujoco.yaml  → mujoco （需装好 mujoco 的 python，见下方 mujoco.python）
  #     config.serial.yaml  → serial （需真机；会**真的动**）
  #   三者共用 8090 端口 ⇒ **不能同时启动**，切换只需换 `-c` 的参数：
  #     ./bin/armpilot-backend.exe -c config.mujoco.yaml
  #   配套验收：core/tools/verify_device_follow.mjs --config {sim|mujoco|serial}
  mode: "sim"
  sim:
    max_servo_speed: 240   # 舵机最大角速度（度/秒）；0 = 瞬时到位。与前端 Mock 默认一致
    latency_ms: 15         # 指令送达延迟：延迟期内不回执
    tick_ms: 20            # 位置推进周期
    enforce_limits: true   # 越界回 ERR JOINT 且位置保持不动（复刻固件行为）
    boot_ms: 0             # 开机静默窗口：模拟 Uno bootloader 交权期（0 = 关闭）
  mujoco:
    # ⚠️ 这里**只有运行参数**。质量/惯量/摩擦/增益在 robot-package/mearm-v1/physics/physics.yaml，
    #    限位与标定在 robot-package/mearm-v1/model/robot.yaml —— 一个都不许抄到这里来。
    #
    # Python 解释器：**必须指向装了 mujoco 包**的那一个，否则启动握手会失败
    # （错误信息里会直接提示，不会表现为"设备可用但没有回执"）。
    #
    # ⚠️ 留空即可，**不要**在这里写本机绝对路径 —— 那是换机器即失效的写法
    #    （本项目的既有态度见 cfg.ResolveMujocoScript 的注释）。留空时的解析顺序：
    #      ① 环境变量 ARMPILOT_MUJOCO_PYTHON（临时切换 / CI 用，不必改被跟踪的文件）
    #      ② <用户目录>/.workbuddy/binaries/python/envs/default 下的隔离环境
    #         （Scripts/python.exe · bin/python —— 相对位置，换用户名照样成立）
    #      ③ PATH 里的 python
    #    本机可用值（隔离环境，py3.13 + mujoco 3.13 + numpy + pyyaml）：
    #      C:/Users/<you>/.workbuddy/binaries/python/envs/default/Scripts/python.exe
    python: ""
    # 留空 = 按 ../simulation/mujoco/server.py → simulation/... 依次回退
    script: ""
    report_hz: 30          # STATE 上报频率（Hz）
    phys_hz: 1000          # 物理步频率（Hz）—— 渲染帧率不决定它
    batch_ms: 10           # 每次实时对齐前连续推进 10ms
    #    ↑ Windows 的 sleep 粒度约 1~2ms；按物理步逐步 sleep 会让仿真
    #      比真实时间慢一个数量级，"实时"就名存实亡。
    no_realtime: false     # true = 不做实时对齐（离线回归 / 压测）
    start_timeout_ms: 20000  # 启动握手超时（首次 import mujoco 较慢）
  serial:
    # ⚠️ 运行参数在这里；**标定/限位不在这里**（全在 robot-package/mearm-v1/model/robot.yaml）
    port: "COM18"          # 本机实测：USB-SERIAL CH340 = 机械臂（sim 模式不使用，仅为一致性）
    baud: 115200
    data_bits: 8
    stop_bits: 1
    parity: "N"
    reconnect_sec: 3       # 打开失败/断链后的重试间隔
    # 单条**固件指令**的等待上限。一条关节级 JR 会被拆成多条固件 SET
    # （固件 MAX_PAIRS=3 ⇒ 四舵机 2 条），故 control.ack_timeout_ms 必须更大。
    ack_timeout_ms: 600
    # 打开端口会拉低 DTR 使 Uno 复位，optiboot 交权窗口实测 ~2.2~2.6s；
    # 窗口内不下发任何指令，Connected() 也保持 false（不假装可用）。
    connect_settle_ms: 2600
    warmup: true           # 先投一个会被吞掉的换行，让首条真指令成为第 2 个包

control:
  ack_timeout_ms: 1500     # 一条 JR 可能含 2 条固件 SET，超时要覆盖两个来回
  min_send_interval_ms: 0  # 两次下发最小间隔；0 = 不限制（节流已在浏览器侧做）
  # 标定回执核对容差（舵机角度）。必须按链路末端的量化步长设置：
  #   sim    = 0.1   （回执是内部计算值，量化 0.01°）
  #   serial = 1.0   （固件舵机角是**整数**，取整误差最大 0.5°，留一倍余量）
  calib_tolerance_deg: 0.1
